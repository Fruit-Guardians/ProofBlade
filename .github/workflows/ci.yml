name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, evaluate, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce change and documentation contracts
        env:
          COMPONENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run reports:project
          npm run check:components -- --base "$COMPONENT_BASE_SHA"
          npm run check:change-contracts -- --base "$COMPONENT_BASE_SHA"
          npm run check:project-reports -- --base "$COMPONENT_BASE_SHA"
      - name: Run repository verification
        run: npm run verify
